name: "Finance"
version: "0.10.0"
slug: "finance"
description: "Lokale Verwaltung persönlicher Finanzen – schlank für HA OS auf dem Raspberry Pi"
url: "https://github.com/karst3nl/homeassistant-finance"

# Die URL bleibt stabil: aus ihr leitet der Supervisor die Add-on-ID ab.
image: "ghcr.io/karst3nl/finance"

arch:
  - aarch64
  - amd64

init: false
startup: application
boot: auto
stage: experimental

ingress: true
ingress_port: 8099
panel_icon: "mdi:chart-pie"
panel_title: "Finanzen"
panel_admin: true
watchdog: "http://[HOST]:[PORT:8099]/healthz"

# Keine HA-API, keine Sensoren, kein MQTT, keine offenen Ports.
# Der Snapshot liegt in /data und wird mit dem HA-Backup gesichert.
backup: hot
backup_pre: "python3 /app/backup.py pre"
backup_post: "python3 /app/backup.py post"

options:
  log_level: info
schema:
  log_level: "list(debug|info|warning|error)"
