[project]
name = "homeassistant-finance"
version = "0.15.2"
description = "Schlankes Home-Assistant-Add-on für persönliche Finanzen"
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["addons/finance/app"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
