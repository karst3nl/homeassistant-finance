name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Ruff (Lint)
        run: ruff check .

      - name: Ruff (Format)
        run: ruff format --check .

      - name: yamllint
        run: yamllint -c .yamllint .
