<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="{{ base }}" />
    <title>{% block title %}Finanzen{% endblock %}</title>
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <strong class="brand">Finanzen</strong>
      <nav>
        <a href="">Übersicht</a>
        <a href="ui/transactions">Buchungen</a>
        <a href="ui/budgets">Budgets</a>
        <a href="ui/reports">Auswertungen</a>
        <a href="ui/accounts">Konten</a>
        <a href="ui/categories">Kategorien</a>
      </nav>
    </header>
    <main>
      {% if errors %}
      <div class="errors" role="alert">
        <ul>
          {% for error in errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
